<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <!-- UI ELEMENTS -->
    <div id="toolbar">
        <input type="file" id="input_file" style="display: none;">
        <button onclick="input_file_element.click();">Input File</button>
        <p id="timer_display">Timer</p>
        <button onclick="settings_dialog_element.show();">Settings</button>
    </div>
    <div id="display_area">
        <div id="question_area" class="text_container">
            <p>Question</p>
            <textarea readonly="true"></textarea>
        </div>
        <div id="answer_area" class="text_container">
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr;">
                <p></p>
                <p>Answer</p>
                <p class="counter_p"></p>
            </div>
            <textarea></textarea>
        </div>
    </div>

    <!-- Dialog tags -->
    <dialog id="settings_dialog">
        <div style="display: grid; grid-template-rows: 1fr 30px;">
            <div style="display: grid; grid-template-columns: 1fr 1fr;">
                <p>Case Sensitivity : </p>
                <input type="checkbox" id="case_sensitivity">
                <p>Random Mode : </p>
                <input type="checkbox" id="random_mode">
            </div>
            <div style="display: flex; flex-direction: column; width: 100%; height: 100%;">
                <button onclick="settings_dialog_element.close();" style="width: 100%; height: 100%;">Close</button>
            </div>
        </div>
    </dialog>

    <!-- Script tags -->
    <script src="./index.js"></script>
</body>

</html>
